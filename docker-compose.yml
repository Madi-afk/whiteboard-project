services:
  minio:
    image: minio/minio:latest
    container_name: whiteboard-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: whiteboard-backend
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: whiteboards
      PUBLIC_APP_URL: http://10.111.143.20:5173
    depends_on:
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: whiteboard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  minio_data:
